[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_aug_pretraining"
version = "1.0.0"
description = "Training-time data augmentation for data-constrained language model pretraining"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "datasets==5.0.1",
    "lm_eval[hf]==0.4.12",
    "numpy>=2.0.0",
    "python-dotenv==1.2.3",
    "torch>=2.6.0",
    "transformers==5.15.0",
    "wandb==0.28.2",
    "accelerate==1.14.0",
    "matplotlib==3.11.1",
    "scipy==1.18.0",
    "huggingface_hub>=0.30.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
